<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCAN FIN v3</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><h1>SCAN FIN <span>v3</span></h1><p>PDF/DOCX → efek scanner → PDF siap download</p></header>
<section class="card">
<h2>1. File utama</h2>
<label class="drop" id="drop" for="file">
<input id="file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
<b>Klik atau Drag & Drop</b><small>PDF atau DOCX</small><em id="name">Belum ada file</em>
</label>
</section>
<section class="card"><h2>2. Pengaturan SCAN</h2><div class="grid">
<label>Resolusi <input id="dpi" type="number" value="96" min="72" max="200"><small>DPI</small></label>
<label>Noise / bercak <input id="noise" type="range" min="0" max="100" value="25"><output id="noiseOut">25%</output></label>
<label>Kemelesetan perspektif <input id="warp" type="range" min="0" max="3" step="0.1" value="3"><output id="warpOut">3 mm</output></label>
<label>Seed random <input id="seed" type="number" placeholder="Otomatis"><small>Isi jika ingin hasil dapat diulang</small></label>
</div></section>
<section class="card"><h2>3. File tanda tangan <small>(opsional)</small></h2>
<input id="signature" type="file" accept="image/png,image/jpeg,image/webp">
<div class="grid compact"><label>Ukuran <input id="sigSize" type="range" min="5" max="35" value="18"><output id="sigSizeOut">18%</output></label><label>Posisi X <input id="sigX" type="range" min="0" max="100" value="68"><output id="sigXOut">68%</output></label><label>Posisi Y <input id="sigY" type="range" min="0" max="100" value="84"><output id="sigYOut">84%</output></label><label>Halaman <input id="sigPages" placeholder="all / 1,3,5"><small>Contoh: all atau 1,3,5</small></label></div>
<p class="hint">Tanda tangan mendapat transform acak maksimal 3%.</p></section>
<section class="card"><h2>4. File tempel <small>(opsional)</small></h2>
<input id="sticker" type="file" accept="image/png,image/jpeg,image/webp">
<div class="grid compact"><label>Ukuran <input id="stkSize" type="range" min="5" max="40" value="18"><output id="stkSizeOut">18%</output></label><label>Posisi X <input id="stkX" type="range" min="0" max="100" value="50"><output id="stkXOut">50%</output></label><label>Posisi Y <input id="stkY" type="range" min="0" max="100" value="50"><output id="stkYOut">50%</output></label><label>Halaman <input id="stkPages" placeholder="all / 2,4"><small>Contoh: all atau 2,4</small></label></div>
<p class="hint">File tempel diputar acak sekitar ±3°.</p></section>
<section class="card actions"><button id="run" disabled>SCAN & BUAT PDF</button><div id="status"></div><a id="download" hidden></a></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/docx-preview@0.3.6/dist/docx-preview.min.js"></script>
<script src="app.js"></script>
</body></html>
