<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCAN FIN</title><link rel="stylesheet" href="style.css"></head><body><main><h1>SCAN FIN</h1><p>PDF → efek scan → PDF _FIN</p><label class="drop" id="drop"><input id="file" type="file" accept="application/pdf">Pilih atau jatuhkan PDF<br><small id="name">Belum ada file</small></label><section><label>Resolusi <input id="dpi" type="number" value="96" min="72" max="300"> DPI</label><label>Noise <input id="noise" type="range" min="0" max="100" value="25"><output id="noiseOut">25%</output></label><label>Kemelesetan perspektif <input id="warp" type="range" min="0" max="3" step="0.1" value="3"><output id="warpOut">3 mm</output></label></section><button id="run" disabled>SCAN</button><p id="status"></p><a id="download" hidden></a><hr><h3>Aturan</h3><ul><li>96 DPI</li><li>Noise/bercak ringan</li><li>Perspective/skew acak maksimal 3 mm</li><li>Tidak memakai rotasi 3–5° CW</li><li>Urutan halaman tetap</li><li>Nama: file asli + _FIN.pdf</li></ul><p>Versi GitHub Pages ini menerima PDF. DOCX langsung memerlukan backend/konverter DOCX.</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script type="module" src="app.js"></script></body></html>
